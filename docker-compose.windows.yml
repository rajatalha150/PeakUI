# PeakUI Docker Compose for Windows
# Usage: docker compose -f docker-compose.windows.yml up --build
#
# Prerequisites:
#   - Docker Desktop installed and running (WSL2 backend)
#   - Ollama running on 0.0.0.0:11434 (run restart-ollama-for-docker.bat)
#   - PowerShell execution policy allows scripts: Set-ExecutionPolicy RemoteSigned -Scope CurrentUser

services:
  searxng:
    image: searxng/searxng:latest
    restart: always
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-peakui-local-search-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    networks:
      - peakui

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peakui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-peakui}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peakui -d peakui"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    restart: always
    ports:
      - "9050:9150"
    healthcheck:
      test: ["CMD-SHELL", "curl -x socks5h://localhost:9150 https://check.torproject.org/api/ip || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The coding daemon uses a bridge-network address on Docker Desktop. The app
  # reaches it by service name; it is never published to the host/browser.
  coder:
    image: peakui-coder
    build:
      context: .
      dockerfile: Dockerfile.coder
    restart: always
    init: true
    pids_limit: 4096
    mem_limit: 8g
    cpus: ${CODER_CPUS:-4.0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_BOOT
      - SYS_TIME
      - SYSLOG
      - AUDIT_CONTROL
      - AUDIT_READ
      - MAC_ADMIN
      - MAC_OVERRIDE
      - SETFCAP
    environment:
      QWEN_SERVER_TOKEN: ${CODER_SERVER_TOKEN:-}
      OPENAI_API_KEY: ${CODER_OPENAI_API_KEY:-local}
      OPENAI_MODEL: ${CODER_MODEL:-gemma4:latest}
      OPENAI_BASE_URL: ${CODER_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      QWEN_DEBUG_LOG_FILE: "1"
      CODER_MIN_FREE_GB: ${CODER_MIN_FREE_GB:-12}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4170/health',{signal:AbortSignal.timeout(4000),headers:process.env.QWEN_SERVER_TOKEN?{Authorization:'Bearer '+process.env.QWEN_SERVER_TOKEN}:{}}).then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - coder_workspace:/workspace
      - coder_apps:/apps
      - coder_qwen_state:/root/.qwen
      - coder_gradle_cache:/root/.gradle
      - coder_android_home:/root/.android
      - coder_npm_cache:/root/.npm
      - coder_pip_cache:/root/.cache/pip
      - coder_android_sdk:/opt/android-sdk
      - coder_root_home:/root
    networks:
      - peakui

  app:
    image: peakui-app
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: "256m"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WORKSPACE_TOOL_HOST_HOME_DIR: ${WORKSPACE_TOOL_HOST_HOME_DIR:?WORKSPACE_TOOL_HOST_HOME_DIR is required}
      WORKSPACE_TOOL_HOST_TMP_DIR: ${WORKSPACE_TOOL_HOST_TMP_DIR:?WORKSPACE_TOOL_HOST_TMP_DIR is required}
      WORKSPACE_TOOL_HOST_WORKSPACE_DIR: ${WORKSPACE_TOOL_HOST_WORKSPACE_DIR:?WORKSPACE_TOOL_HOST_WORKSPACE_DIR is required}
      WORKSPACE_TOOL_HOST_EXECUTOR_URL: ${WORKSPACE_TOOL_HOST_EXECUTOR_URL:-http://host.docker.internal:4318}
      WORKSPACE_TOOL_HOST_EXECUTOR_TOKEN: ${WORKSPACE_TOOL_HOST_EXECUTOR_TOKEN:-}
      WORKSPACE_TOOL_HOST_PROJECTS_DIR: ${WORKSPACE_TOOL_HOST_PROJECTS_DIR:-C:\Users\%USERNAME%\Desktop}
      TOR_PROXY_URL: socks5://tor-proxy:9150
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
      SCREENCAST_PORT: 3001
      PEAKUI_DATA_DIR: /var/lib/peakui
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
      GOOGLE_SEARCH_CX: ${GOOGLE_SEARCH_CX:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CODER_DAEMON_URL: ${CODER_DAEMON_URL:-http://coder:4170}
      CODER_SERVER_TOKEN: ${CODER_SERVER_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      CODER_PROJECTS_HOST_ROOT: /coder-workspace/projects
      CODER_WORKSPACE_HOST_ROOT: /coder-workspace
      CODER_APPS_HOST_ROOT: /coder-apps
    depends_on:
      searxng:
        condition: service_started
      db:
        condition: service_healthy
      tor-proxy:
        condition: service_started
      coder:
        condition: service_healthy
    restart: always
    volumes:
      - type: bind
        source: ${WORKSPACE_TOOL_HOST_HOME_DIR}
        target: /mnt/workspace-tool/home
        read_only: true
      - type: bind
        source: ${WORKSPACE_TOOL_HOST_TMP_DIR}
        target: /mnt/workspace-tool/tmp
        read_only: true
      - type: bind
        source: ${WORKSPACE_TOOL_HOST_WORKSPACE_DIR}
        target: /mnt/workspace-tool/workspace
      - type: bind
        source: ${WORKSPACE_TOOL_HOST_PROJECTS_DIR:-C:\Users\%USERNAME%\Desktop}
        target: /mnt/workspace-tool/projects
      - app_runtime:/var/lib/peakui
      - coder_workspace:/coder-workspace:rw
      - coder_apps:/coder-apps:ro
    networks:
      - peakui

volumes:
  db_data:
  app_runtime:
  searxng_cache:
  coder_workspace:
  coder_apps:
  coder_qwen_state:
  coder_root_home:
  coder_gradle_cache:
  coder_android_home:
  coder_npm_cache:
  coder_pip_cache:
  coder_android_sdk:

networks:
  peakui:
    driver: bridge
