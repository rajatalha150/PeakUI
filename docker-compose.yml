# WARNING: network_mode: host only works on Linux Docker hosts.
# Docker Desktop for Windows does NOT support host networking.
# Use docker-compose.windows.yml on Windows instead.

services:
  searxng:
    image: searxng/searxng:latest
    restart: always
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-peakui-local-search-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    # The app uses host networking on Linux, so bind SearXNG only to loopback.
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"

  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peakui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-peakui}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro

  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    restart: always
    ports:
      - "9050:9150"
    healthcheck:
      test: ["CMD-SHELL", "curl -x socks5h://localhost:9150 https://check.torproject.org/api/ip || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  coder:
    image: peakui-coder
    build:
      context: .
      dockerfile: Dockerfile.coder
    restart: always
    # The coding environment: Qwen Code daemon (brain) + dev toolchain.
    # Host networking (like the app) so it binds loopback directly and reaches
    # the host's Ollama at 127.0.0.1:11434 — no token, no host.docker.internal.
    network_mode: host
    # Runtime isolation (Phase 1). Host networking is deliberate, so the daemon
    # still gets bounded even while sharing the host's network stack:
    #   - pids_limit: a runaway agent can't fork-bomb the process table
    #   - mem_limit: a runaway tool can't exhaust the host's RAM
    #   - no-new-privileges: setuid/setgid can't escalate inside the container
    #   - cap_drop: drop the host-dangerous capabilities — with host networking,
    #     NET_ADMIN can rewrite the host's interfaces, and SYS_ADMIN/SYS_MODULE/
    #     SYS_RAWIO are root-escalation footguns the dev toolchain never needs.
    # Full non-root + dropping host networking is a Phase 7 migration (it needs a
    # bridge network to reach Ollama), not a one-line config flip.
    pids_limit: 4096
    mem_limit: 8g
    cpus: ${CODER_CPUS:-4.0}
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4170/health',{signal:AbortSignal.timeout(4000),headers:process.env.QWEN_SERVER_TOKEN?{Authorization:'Bearer '+process.env.QWEN_SERVER_TOKEN}:{}}).then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_BOOT
      - SYS_TIME
      - SYSLOG
      - AUDIT_CONTROL
      - AUDIT_READ
      - MAC_ADMIN
      - MAC_OVERRIDE
      - SETFCAP
    environment:
      - QWEN_SERVER_TOKEN=${CODER_SERVER_TOKEN:-}
      # Model/provider, driven by the Coding settings UI (Phase 5). Defaults to
      # local Ollama with a dummy key; swap these for cloud providers.
      - OPENAI_API_KEY=${CODER_OPENAI_API_KEY:-local}
      - OPENAI_MODEL=${CODER_MODEL:-gemma4:latest}
      - OPENAI_BASE_URL=${CODER_OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
      # Enable the daemon's debug log (session-scoped) so the vision bridge's
      # warn/error output is observable — otherwise a silent bridge failure
      # (e.g. "vision model returned no description") is completely invisible.
      - QWEN_DEBUG_LOG_FILE=1
      # Do not start a large build without this much free space. The readiness
      # helper reports a clear warning instead of allowing destructive cleanup.
      - CODER_MIN_FREE_GB=${CODER_MIN_FREE_GB:-12}
    volumes:
      - coder_workspace:/workspace
      - coder_apps:/apps
      - coder_qwen_state:/root/.qwen
      # Explicit protected cache/toolchain volumes. These survive image
      # recreation and are intentionally outside any supported cleanup target.
      - coder_gradle_cache:/root/.gradle
      - coder_android_home:/root/.android
      - coder_npm_cache:/root/.npm
      - coder_pip_cache:/root/.cache/pip
      - coder_android_sdk:/opt/android-sdk
      # Persist the whole home dir (/root) so SSH keys, git identity, npm cache,
      # and any dotfile the agent writes survive redeploys. Mounting /root — NOT
      # / — keeps the image-managed tooling (/opt/qwen-code, /usr, Chrome libs)
      # rebuildable so fixes keep flowing, while all runtime state is retained.
      # (Nested coder_qwen_state at /root/.qwen still wins for that subtree.)
      - coder_root_home:/root

  app:
    image: peakui-app
    build: .
    shm_size: "256m"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WORKSPACE_TOOL_HOST_HOME_DIR=${WORKSPACE_TOOL_HOST_HOME_DIR:-/home}
      - WORKSPACE_TOOL_HOST_TMP_DIR=${WORKSPACE_TOOL_HOST_TMP_DIR:-/tmp}
      - WORKSPACE_TOOL_HOST_WORKSPACE_DIR=${WORKSPACE_TOOL_HOST_WORKSPACE_DIR:-/home/raza/.peakui/workspace}
      - WORKSPACE_TOOL_HOST_EXECUTOR_URL=${WORKSPACE_TOOL_HOST_EXECUTOR_URL:-http://127.0.0.1:4318}
      - WORKSPACE_TOOL_HOST_EXECUTOR_TOKEN=${WORKSPACE_TOOL_HOST_EXECUTOR_TOKEN:-}
      - TOR_PROXY_URL=${TOR_PROXY_URL:-socks5://localhost:9050}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - SCREENCAST_PORT=3001
      - PEAKUI_DATA_DIR=/var/lib/peakui
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:8080}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY:-}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      - CODER_DAEMON_URL=${CODER_DAEMON_URL:-http://127.0.0.1:4170}
      - CODER_SERVER_TOKEN=${CODER_SERVER_TOKEN:-}
      # GitHub App credentials remain server-side. The App's setup URL must be
      # https://<PeakUI host>/api/integrations/github/callback.
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - CODER_PROJECTS_HOST_ROOT=/coder-workspace/projects
      - CODER_WORKSPACE_HOST_ROOT=/coder-workspace
      - CODER_APPS_HOST_ROOT=/coder-apps
    depends_on:
      - searxng
      - db
      - tor-proxy
    restart: always
    network_mode: host
    volumes:
      - ${WORKSPACE_TOOL_HOST_HOME_DIR:-/home}:/mnt/workspace-tool/home:ro
      - ${WORKSPACE_TOOL_HOST_TMP_DIR:-/tmp}:/mnt/workspace-tool/tmp:ro
      - ${WORKSPACE_TOOL_HOST_WORKSPACE_DIR:-/home/raza/.peakui/workspace}:/mnt/workspace-tool/workspace:rw
      - ${WORKSPACE_TOOL_HOST_PROJECTS_DIR:-/home/raza/Desktop}:/mnt/workspace-tool/projects:rw
      - ${COMFYUI_MODELS_DIR:-/home/raza/ComfyUI/models}:/mnt/comfyui/models:rw
      - app_runtime:/var/lib/peakui
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:rw
      # Controlled project imports use the same volume the coder sees at
      # /workspace. No browser or agent supplies the host-side destination.
      # The app also streams explorer downloads straight from these shared
      # volumes (no daemon size ceiling); both coder workspace roots are mounted.
      - coder_workspace:/coder-workspace:rw
      - coder_apps:/coder-apps:ro

volumes:
  db_data:
  app_runtime:
  searxng_cache:
  coder_workspace:
  coder_apps:
  coder_qwen_state:
  coder_root_home:
  coder_gradle_cache:
  coder_android_home:
  coder_npm_cache:
  coder_pip_cache:
  coder_android_sdk:
