# WARNING: network_mode: host only works on Linux Docker hosts.
# Docker Desktop for Windows does NOT support host networking.
# Use docker-compose.windows.yml on Windows instead.

services:
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peakui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-peakui}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    restart: always
    ports:
      - "9050:9150"
    healthcheck:
      test: ["CMD-SHELL", "curl -x socks5h://localhost:9150 https://check.torproject.org/api/ip || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    image: peakui-app
    build: .
    shm_size: "256m"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - OPENCLAW_HOST_HOME_DIR=${OPENCLAW_HOST_HOME_DIR:-/home}
      - OPENCLAW_HOST_TMP_DIR=${OPENCLAW_HOST_TMP_DIR:-/tmp}
      - OPENCLAW_HOST_WORKSPACE_DIR=${OPENCLAW_HOST_WORKSPACE_DIR:-/home/raza/.peakui/workspace}
      - OPENCLAW_HOST_EXECUTOR_URL=${OPENCLAW_HOST_EXECUTOR_URL:-http://127.0.0.1:4318}
      - OPENCLAW_HOST_EXECUTOR_TOKEN=${OPENCLAW_HOST_EXECUTOR_TOKEN:-}
      - TOR_PROXY_URL=${TOR_PROXY_URL:-socks5://localhost:9050}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - SCREENCAST_PORT=3001
      - PEAKUI_DATA_DIR=/var/lib/peakui
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY:-}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX:-}
    depends_on:
      - db
      - tor-proxy
    restart: always
    network_mode: host
    volumes:
      - ${OPENCLAW_HOST_HOME_DIR:-/home}:/mnt/openclaw/home:ro
      - ${OPENCLAW_HOST_TMP_DIR:-/tmp}:/mnt/openclaw/tmp:ro
      - ${OPENCLAW_HOST_WORKSPACE_DIR:-/home/raza/.peakui/workspace}:/mnt/openclaw/workspace:rw
      - ${OPENCLAW_HOST_PROJECTS_DIR:-/home/raza/Desktop}:/mnt/openclaw/projects:rw
      - app_runtime:/var/lib/peakui
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:rw

volumes:
  db_data:
  app_runtime:
