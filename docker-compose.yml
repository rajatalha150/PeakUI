services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: viewllama
      POSTGRES_PASSWORD: password
      POSTGRES_DB: viewllama
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    restart: always
    ports:
      - "9050:9150"
    healthcheck:
      test: ["CMD-SHELL", "curl -x socks5h://localhost:9150 https://check.torproject.org/api/ip || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    build: .
    shm_size: "256m"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://viewllama:password@localhost:5432/viewllama
      - JWT_SECRET=super-secret-key-for-jwt-auth-that-should-be-long-and-secure
      - OPENCLAW_HOST_HOME_DIR=${OPENCLAW_HOST_HOME_DIR:-/home}
      - OPENCLAW_HOST_TMP_DIR=${OPENCLAW_HOST_TMP_DIR:-/tmp}
      - OPENCLAW_HOST_WORKSPACE_DIR=${OPENCLAW_HOST_WORKSPACE_DIR:-/tmp/viewllama-openclaw-workspace}
      - OPENCLAW_HOST_EXECUTOR_URL=${OPENCLAW_HOST_EXECUTOR_URL:-http://127.0.0.1:4318}
      - OPENCLAW_HOST_EXECUTOR_TOKEN=${OPENCLAW_HOST_EXECUTOR_TOKEN:-}
      - TOR_PROXY_URL=${TOR_PROXY_URL:-socks5://localhost:9050}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
    depends_on:
      - db
      - tor-proxy
    restart: always
    network_mode: host
    volumes:
      - ${OPENCLAW_HOST_HOME_DIR:-/home}:/mnt/openclaw/home:ro
      - ${OPENCLAW_HOST_TMP_DIR:-/tmp}:/mnt/openclaw/tmp:ro
      - ${OPENCLAW_HOST_WORKSPACE_DIR:-/tmp/viewllama-openclaw-workspace}:/mnt/openclaw/workspace

volumes:
  db_data:
