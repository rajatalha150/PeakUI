name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Test bundle budget measurement
        run: node --test scripts/check-bundle-budget.node-test.mjs scripts/coder-preview-gateway.node-test.mjs scripts/sync-coder-models.node-test.mjs

      - name: Build background workers
        run: npm run rag:build && npm run workspace-daemon:build

      - name: Build production app
        run: npm run build
        env:
          # Dummy values required by the Next.js build and Prisma config.
          # Real secrets are never committed; they are injected at runtime.
          DATABASE_URL: postgresql://peakui:ci-password@localhost:5432/peakui
          JWT_SECRET: ci-jwt-secret-must-be-at-least-thirty-two-characters-long
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check bundle budget
        run: npm run bundle:check
