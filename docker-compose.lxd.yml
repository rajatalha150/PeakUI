# Linux only: run Coder in an LXD system container while keeping the rest of
# PeakUI in Docker. Use with `-f docker-compose.yml -f docker-compose.lxd.yml`.
services:
  coder:
    profiles: [docker-coder]

  app:
    environment:
      CODER_BACKEND: lxd
      CODER_SHARED_VOLUMES: "false"
      CODER_DAEMON_URL: http://127.0.0.1:${CODER_LXD_PORT:-4171}
